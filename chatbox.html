<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riyan Chatbox - Project Dim</title>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" role="application">
    <main class="main-content" id="content-area">
      <h2 class="section-title">
        <i class="ph ph-paper-plane-tilt"></i>
        <span>Kotak Obrolan</span>
      </h2>
      
      <div class="chat-wrapper" id="chatbox-c">
        <!-- Header Chatbox -->
        <div class="chat-header">
          <div class="chat-header-info">
            <div class="chat-status-indicator"></div>
            <div>
              <h2 class="chat-title">Live Conversation</h2>
              <p class="chat-subtitle">Tinggalkan pesan atau berdiskusi langsung</p>
            </div>
          </div>
        </div>

        <!-- Container Pesan -->
        <div class="chat-messages-container" id="chat-messages-box"></div>

        <!-- Input Section -->
        <div class="chat-input-wrapper" style="display: none;">
          <!-- Preview Foto -->
          <div id="image-preview-container" style="display: none;">
            <div class="preview-thumb-box">
              <img id="image-preview" class="preview-img" src="" alt="Pratinjau">
              <button type="button" id="cancel-image-btn" aria-label="Batal pilih gambar">&times;</button>
            </div>
            <span id="preview-file-name">Foto siap dikirim...</span>
          </div>

          <!-- Form Chat -->
          <form class="chat-input-form" onsubmit="event.preventDefault();">
            <div class="input-group-custom">
              <input type="file" id="photo-input" accept="image/*" style="display: none;">
              <input type="text" placeholder="Tulis pesan Anda di sini..." class="chat-field">
              
              <button type="button" class="chat-action-btn" id="select-photo-btn" title="Tambah Foto">
                <i class="ph ph-image"></i>
              </button>
              
              <button type="submit" class="chat-send-btn">
                <i class="ph ph-paper-plane-right"></i>
                <span>Kirim</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tombol Auth Google -->
      <button type="button" class="google-auth-btn" id="login-btn-chat" style="display: none;">
        <svg class="google-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="btn-text">Sign in with Google</span>
      </button>
    </main>
  </div>

  <script type="module" src="/js/chatbox.js"></script>
</body>
</html>
